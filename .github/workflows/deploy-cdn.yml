# Builds the web app from main and publishes it behind the Vultr CDN: the files go to a Vultr Object Storage
# bucket, and the CDN pull zone in front of that bucket is purged. Setup is in the README ("Deploying the web app").
name: Deploy web app to Vultr CDN

on:
  push:
    branches: [main]
    # Only what ends up in web/dist. A purge is allowed once every six hours, so other pushes should not spend it.
    paths:
      - 'web/**'
      - 'shared/**'
      - 'modeling/output/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'server/package.json'
      - 'server/src/config.ts'
      - 'server/src/scripts/deployWeb.ts'
      - 'server/src/services/objectStorage.ts'
      - '.github/workflows/deploy-cdn.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A running deploy finishes; of the ones waiting, only the newest commit runs.
concurrency:
  group: deploy-cdn
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The models are in Git LFS. Caching them keeps each deploy from using up the LFS download allowance.
      - name: List LFS files
        run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - name: Fetch LFS files
        run: |
          git lfs install --local
          git lfs pull

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @faresight/web build
        env:
          # Where the Fastify server lives. The CDN serves files only, so /api cannot be reached through it.
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}

      - name: Upload and purge
        run: pnpm --filter @faresight/server run deploy-web
        env:
          VULTR_S3_ENDPOINT: ${{ vars.VULTR_S3_ENDPOINT }}
          VULTR_S3_REGION: ${{ vars.VULTR_S3_REGION }}
          VULTR_S3_ACCESS_KEY: ${{ secrets.VULTR_S3_ACCESS_KEY }}
          VULTR_S3_SECRET_KEY: ${{ secrets.VULTR_S3_SECRET_KEY }}
          WEB_BUCKET: ${{ vars.WEB_BUCKET }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VULTR_CDN_PULL_ZONE_ID: ${{ vars.VULTR_CDN_PULL_ZONE_ID }}
